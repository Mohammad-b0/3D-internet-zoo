name: Mininet Connectivity Test

on:
  push:
  pull_request:

jobs:
  mininet-test:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mininet and OVS
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            mininet \
            openvswitch-switch \
            openvswitch-common \
            python3 \
            python3-pip

      - name: Start Open vSwitch service
        run: |
          sudo service openvswitch-switch start

      - name: Verify OVS
        run: |
          sudo ovs-vsctl show
          lsmod | grep openvswitch || true

      - name: Cleanup stale Mininet state
        run: |
          sudo mn -c

      - name: Run Mininet topology
        run: |
          sudo -E python3 topo.py | tee mininet_output.log

      - name: Verify ping success
        run: |
          grep "PING SUCCESS" mininet_output.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mininet-logs
          path: mininet_output.log